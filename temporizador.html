<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer</title>
    <link rel="stylesheet" href="styles.css">
    <script>
        function startCountdown() {
            const SIX_MONTHS_IN_MS = 6 * 30 * 24 * 60 * 60 * 1000; // 6 months in milliseconds

            // Revisar si ya existe un tiempo final guardado en Local Storage
            let endTime = localStorage.getItem("countdownEndTime");

            // Si no existe, calcular el tiempo final y almacenarlo
            if (!endTime) {
                endTime = Date.now() + SIX_MONTHS_IN_MS; // Fecha actual + 6 meses
                localStorage.setItem("countdownEndTime", endTime);
            } else {
                endTime = parseInt(endTime); // Convertir el valor almacenado a número
            }

            // Actualizar el temporizador cada segundo
            const interval = setInterval(function () {
                const currentTime = Date.now(); // Obtener el tiempo actual
                const remainingTime = endTime - currentTime;

                if (remainingTime <= 0) {
                    clearInterval(interval); // Detener el intervalo (opcional)
                    alert("¡El temporizador ha terminado!"); // Mostrar alerta
                    return;
                }

                // Calcular días, horas, minutos y segundos restantes
                const days = Math.floor(remainingTime / (1000 * 60 * 60 * 24));
                const hours = Math.floor((remainingTime % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((remainingTime % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((remainingTime % (1000 * 60)) / 1000);

                // Mostrar el tiempo restante en los elementos HTML
                document.getElementById("days").innerHTML = days;
                document.getElementById("hours").innerHTML = hours;
                document.getElementById("minutes").innerHTML = minutes;
                document.getElementById("seconds").innerHTML = seconds;
            }, 1000);
        }
    </script>
</head>
<body class="temporizador" onload="startCountdown()">
    <div class="countdown-container">
        <div class="countdown-timer">
            <h1>Countdown to Our Special Day</h1>
            <div id="countdown" class="timer">
                <div class="time-box">
                    <span id="days">0</span>
                    <p>Days</p>
                </div>
                <div class="time-box">
                    <span id="hours">0</span>
                    <p>Hours</p>
                </div>
                <div class="time-box">
                    <span id="minutes">0</span>
                    <p>Minutes</p>
                </div>
                <div class="time-box">
                    <span id="seconds">0</span>
                    <p>Seconds</p>
                </div>
            </div>
            <button onclick="window.location.href='home.html'">Back</button>
        </div>
    </div>
</body>
</html>
