<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goals 2025</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="goals-page">
    <!-- Background Overlay -->
    <div class="background-overlay"></div>

    <!-- Back Button -->
    <button class="back-button" onclick="window.location.href='home.html'">Back</button>
    <a href="temporizador.html">
        <button class="navigation-button">Ir al Temporizador</button>
        <button onclick="window.location.href='temporizador.html'">Continuar</button>
    </a>
    

    <!-- Main Content -->
    <div class="goals-container">
        <h1>Our Goals for 2025</h1>
        <p>Dream big, love deeper, and grow stronger together.</p>

        <!-- Image Carousel -->
        <div class="carousel">
            <div class="carousel-slide">
                <img src="images/paris.jpg" alt="Wedding Goal">
                <p>Marriage: Building a life together full of love and commitment.</p>
            </div>
            <div class="carousel-slide">
                <img src="images/discipule.jpg" alt="Faith Goal">
                <p>Stronger Relationship with Christ: Walking in faith and love.</p>
            </div>
            <div class="carousel-slide">
                <img src="images/iglesia.jpg" alt="Travel Goal">
                <p>Explore the World: Creating memories in beautiful places.</p>
            </div>
        </div>

        <!-- Carousel Controls -->
        <div class="carousel-controls">
            <button id="prev" onclick="moveSlide(-1)">&#10094;</button>
            <button id="next" onclick="moveSlide(1)">&#10095;</button>
        </div>
    </div>

    <!-- Floating Hearts -->
    <div class="floating-hearts">
        <div class="heart"></div>
        <div class="heart"></div>
        <div class="heart"></div>
    </div>

    <!-- Carousel Script -->
    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.carousel-slide');

        function showSlide(index) {
            slides.forEach((slide, i) => {
                slide.style.display = i === index ? 'block' : 'none';
            });
        }

        function moveSlide(step) {
            currentSlide = (currentSlide + step + slides.length) % slides.length;
            showSlide(currentSlide);
        }

        // Initialize carousel
        showSlide(currentSlide);
    </script>
</body>
</html>
